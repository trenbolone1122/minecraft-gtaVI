name: In-game tests

# Starts a real Minecraft client on a virtual screen and runs the client game tests for the chosen modules.
# Screenshots are uploaded as artifacts. Manual only: each module takes several minutes.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: Comma separated modules (smoke,hud,character,weapon,gameplay,fx,build,world,road,landmark,vicecity,vehicle,aircraft,look,shader)
        required: true
        default: smoke,hud,character,weapon,gameplay,fx

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(echo '${{ github.event.inputs.modules }}' | python3 -c 'import json,sys; print(json.dumps([m.strip() for m in sys.stdin.read().split(",") if m.strip()]))')" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Virtual screen and software rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgles2
      - name: Run client game tests
        run: |
          GLENV=""
          if [ "${{ matrix.module }}" = "shader" ]; then GLENV="SDL_VIDEO_FORCE_EGL=1"; fi
          env $GLENV LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x900x24" \
            ./gradlew runClientGameTest -PleonidaTest=${{ matrix.module }} --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.module }}
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
