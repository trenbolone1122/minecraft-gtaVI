name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the mod jar
        run: ./gradlew build --no-daemon --console=plain
      - name: Check text rules (no em or en dashes)
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or any(part in ('.git', 'build', '.gradle') for part in p.parts):
                  continue
              try:
                  t = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if chr(0x2014) in t or chr(0x2013) in t:
                  bad.append(str(p))
          if bad:
              print('Em or en dashes found in:', *bad, sep='\n  ')
              sys.exit(1)
          PY
      - name: Upload the jar (skipped when the account artifact storage is full; releases always carry the jar)
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: leonida-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 3
          if-no-files-found: error
