# Leonida Shaders: an original Iris/OptiFine format shader pack for the Leonida mod. GPL-3.0-or-later.
version.1.0.0

clouds=off
sun=false
moon=true
oldLighting=false
oldHandLight=false
separateAo=true
underwaterOverlay=false
vignette=false
dynamicHandLight=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
particles.before.deferred=false

# opaque passes overwrite; translucent passes blend colour only
blend.gbuffers_terrain=off
blend.gbuffers_entities=off
blend.gbuffers_block=off
blend.gbuffers_hand=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_water.colortex3=off
blend.gbuffers_water.colortex5=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_hand_water.colortex3=off
blend.gbuffers_hand_water.colortex5=off

# sky-view table
size.buffer.colortex6=192 108

# quality presets
# sized for a 4 GB GTX 1650 class GPU; MEDIUM matches the defaults in lib/settings.glsl
profile.LOW=shadowMapResolution:1024 shadowDistance:48.0 SHADOW_SAMPLES:4 !SSR SSR_STEPS:10 CLOUDS CLOUD_OCTAVES:3 !COLORED_SHADOWS !WAVING_PLANTS BLOOM
profile.MEDIUM=shadowMapResolution:1536 shadowDistance:80.0 SHADOW_SAMPLES:8 SSR SSR_STEPS:16 CLOUDS CLOUD_OCTAVES:3 COLORED_SHADOWS WAVING_PLANTS BLOOM
profile.HIGH=shadowMapResolution:2048 shadowDistance:128.0 SHADOW_SAMPLES:12 SSR SSR_STEPS:20 CLOUDS CLOUD_OCTAVES:4 COLORED_SHADOWS WAVING_PLANTS BLOOM

screen=<profile> <empty> [LIGHTING] [SKY] [WATER] [POST]
screen.LIGHTING=SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS COLORED_SHADOWS sunPathRotation RIM_LIGHT RIM_STRENGTH WAVING_PLANTS
screen.SKY=CLOUDS CLOUD_COVER CLOUD_OCTAVES HAZE_DENSITY DUSK_TINT SUN_SIZE
screen.WATER=SSR SSR_STEPS WATER_WAVES WATER_FOAM WET_NIGHTS WETNESS_AMOUNT
screen.POST=BLOOM BLOOM_STRENGTH EXPOSURE SATURATION VIGNETTE
sliders=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation RIM_STRENGTH CLOUD_COVER CLOUD_OCTAVES HAZE_DENSITY DUSK_TINT SUN_SIZE SSR_STEPS WATER_WAVES WETNESS_AMOUNT BLOOM_STRENGTH EXPOSURE SATURATION VIGNETTE
